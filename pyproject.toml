[project]
name = "pve-mcp"
version = "1.5.2"
description = "Token-efficient MCP server for Proxmox VE (guests, snapshots, backups, storage, LVM/ZFS, guest/host exec, dry-run + tamper-evident audit)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ahmetem", email = "posta@ahmetkaraca.com" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",  # floor is 2.x so deploys converge; mcp_instance.py still runs on 1.x
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "asyncssh>=2.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/ahmetem/homelab-proxmox-mcp"
Repository = "https://github.com/ahmetem/homelab-proxmox-mcp"

[project.scripts]
pve-mcp = "proxmox_mcp.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["proxmox_mcp"]

[tool.setuptools.packages.find]
include = ["proxmox_mcp*"]
